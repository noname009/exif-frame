# Nginx configuration for EXIF Frame static SPA
# Tuned for perceived performance: aggressive caching for hashed assets,
# proper font CORS, instant SPA navigation, and small response sizes.

server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # All processing is client-side; no uploads.
    client_max_body_size 0;
    sendfile             on;
    tcp_nopush           on;
    tcp_nodelay          on;
    keepalive_timeout    65;
    server_tokens        off;

    # ---------- Compression ----------
    gzip                 on;
    gzip_vary            on;
    gzip_min_length      256;
    gzip_comp_level      6;
    gzip_proxied         any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2;

    # ---------- Hashed Vite assets — immutable, 1 year ----------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ---------- WASM (jSquash WebP encoder) ----------
    location ~* \.wasm$ {
        types { application/wasm wasm; }
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---------- Fonts: CORS + long cache ----------
    location ~* \.(woff2?|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        access_log off;
    }

    # ---------- Other static assets — moderate cache ----------
    location ~* \.(png|jpg|jpeg|gif|webp|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ---------- HTML shell — never cache ----------
    # Required so users see new builds immediately when assets refresh.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # ---------- SPA fallback ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- Health check ----------
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
